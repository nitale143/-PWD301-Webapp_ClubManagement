# Nginx làm reverse proxy + HTTPS cho webapp CLB (Ch11 – slide 17).
# Đặt vào /etc/nginx/sites-available/clb rồi symlink sang sites-enabled.
# Chứng chỉ: sudo certbot --nginx -d clb.example.com
# Flask cần TRUST_PROXY_HOPS=1 và TRUSTED_HOSTS=clb.example.com trong .env.

server {
    listen 80;
    server_name clb.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name clb.example.com;

    ssl_certificate     /etc/letsencrypt/live/clb.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/clb.example.com/privkey.pem;

    client_max_body_size 4m;          # lớn hơn MAX_CONTENT_LENGTH (3MB) một chút

    # Ảnh avatar và minh chứng KHÔNG được phục vụ trực tiếp: Flask kiểm tra quyền
    location /static/uploads/ {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
    }

    # CSS/JS/logo công khai: Nginx phục vụ trực tiếp cho nhanh
    location /static/ {
        alias /srv/club/app/static/;
        expires 7d;
        access_log off;
    }

    # Trợ lý AI trả kết quả dạng stream (SSE): tắt buffer
    location /ai/stream {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
    }
}
