{# Thông báo một lần (flash – Ch4 slide 49-50). Jinja tự escape nội dung. #}
{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="flash-container" role="status">{% for category, message in messages %}<div class="flash flash-{{ category }}">{{ message }}</div>{% endfor %}</div>
{% endif %}
{% endwith %}
