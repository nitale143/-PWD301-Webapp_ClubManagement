{% extends "base.html" %}
{% block title %}Tao su kien{% endblock %}
{% block content %}
<div class="auth-box wide">
    <h1>Tao su kien moi</h1>
    <form method="post">
        <label>Ten su kien</label>
        <input type="text" name="ten_su_kien" value="{{ form.get('ten_su_kien','') }}" required>

        <label>Ma su kien (viet tat, khong trung)</label>
        <input type="text" name="ma_su_kien" value="{{ form.get('ma_su_kien','') }}" required>

        <label>Thoi gian bat dau</label>
        <input type="datetime-local" name="thoi_gian_bat_dau" required>

        <label>Thoi gian ket thuc</label>
        <input type="datetime-local" name="thoi_gian_ket_thuc" required>

        <button type="submit">Tao su kien</button>
    </form>
</div>
{% endblock %}
